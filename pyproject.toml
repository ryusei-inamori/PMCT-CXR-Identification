[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmct-cxr-identification"
version = "0.1.0"
description = "Post-publication reconstruction of PMCT-to-antemortem CXR retrieval for forensic personal identification."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ryusei Inamori"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "opencv-python>=4.8",
  "pydicom>=2.4",
  "SimpleITK>=2.3",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
pmct = ["TotalSegmentator>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
